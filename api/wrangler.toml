name = "agenda-familiar-api"
main = "src/index.js"
compatibility_date = "2026-05-01"

# La PWA llama al Worker por su dirección de workers.dev, así que esa ruta se
# declara explícitamente en lugar de dejar que wrangler la active por omisión.
# Las URL de vista previa, en cambio, sobran: publicarían cada versión en una
# dirección propia que nadie usa y que también atendería peticiones.
workers_dev = true
preview_urls = false

# El binding es `DB` a propósito: es el nombre con el que el Worker la busca
# (`env.DB`). No copie el que sugiere `wrangler d1 create`, que deriva del nombre
# de la base de datos y dejaría al Worker sin encontrarla.
[[d1_databases]]
binding = "DB"
database_name = "agenda-familiar"
database_id = "be25fff2-8d9a-4974-81af-331e7f2f1cca"

[vars]
# Orígenes desde los que se admite la PWA. Sin coincidencia no se emiten
# cabeceras CORS, de modo que una web ajena no puede hablar con esta API.
ORIGENES_PERMITIDOS = "https://garciadoral-ops.galoopa.store,http://localhost:8788"

# Audiencias admitidas del token de Apple: el Services ID de la web y el
# identificador del paquete de la app iOS.
APPLE_AUD_WEB = "com.garciadoral.ops.web"
APPLE_AUD_IOS = "com.garciadoral.ops"

# La URL de retorno que la web declara ante Apple. Se repite aquí porque el
# canje del código de autorización —el de la baja de cuenta— exige presentarla
# otra vez, carácter a carácter. Debe ser idéntica a `redireccion` en
# pwa/publico/config.json; `tests/test_configuracion.py` lo comprueba.
REDIRECCION_WEB = "https://garciadoral-ops.galoopa.store"

# Con qué APNs se habla. Son dos servidores distintos y los tokens de uno no
# valen en el otro; el síntoma de equivocarse es un `BadDeviceToken` que no
# explica nada más. Sin valor, producción.
#
# **Y aquí no se toca.** `pruebas` es para lo que se instala desde Xcode, y en
# esta casa no se instala así: las builds van siempre por TestFlight, que firma
# como `produccion` igual que la App Store. Esto fue una atadura mientras se
# depuraba el módulo desde Xcode —con `pruebas` puesto, a los teléfonos de casa
# no les sonaba nada—; dejó de serlo el día que se decidió no depurar así.
# Cambiarlo para una tarde es apagarle los avisos a los otros tres.
APNS_ENTORNO = "produccion"

# Secretos, que NO van aquí. Se registran con `wrangler secret put`:
#   SESION_SECRETO  · clave con la que este Worker firma las sesiones
#   TOKEN_SERVICIO  · credencial del generador del plan semanal (AGENDA_TOKEN)
#   VIAJES_ICAL_URL · URL privada del feed iCal del calendario de viajes. Es una
#                     credencial (quien la tiene lee el calendario), por eso es
#                     secreto y no una var. Sin ella, el cron no hace nada y no
#                     pasa nada más (calendario-viajes.md §8). Rotable en Google.
#
# Y los tres de la revocación ante Apple, que se usan en las dos bajas: la de una
# cuenta y la de una solicitud sin aprobar. Sin
# ellos la baja funciona igual —se deshace el vínculo aquí—, pero no se le avisa
# a Apple, que es la mitad de la directriz 5.1.1(v) que no se ve. Consulte
# docs/despliegue-cloudflare.md §4.5.
#   APPLE_CLAVE_P8  · contenido del fichero .p8 de Sign in with Apple
#   APPLE_CLAVE_ID  · identificador de esa clave (Key ID)
#   APPLE_EQUIPO    · identificador del equipo de Apple Developer (Team ID)
#
# Y los dos de los avisos remotos, que son de **otra** clave: la de Sign in with
# Apple no sirve para APNs aunque las dos sean `.p8` del mismo equipo. Sin ellos
# no se empuja nada y no pasa nada más —el sobre de la cabecera sigue igual—, de
# modo que un despliegue sin esto no es un despliegue roto. El equipo se
# reaprovecha de arriba. Consulte docs/despliegue-cloudflare.md §4.6.
#   APNS_CLAVE_P8   · contenido del fichero .p8 de la clave de APNs
#   APNS_CLAVE_ID   · identificador de esa clave (Key ID)

# El calendario de viajes se sincroniza con un cron del propio Worker: una vez
# al día, minuto y hora desplazados de :00 a propósito, proporcionado a que
# Google regenera el feed cada varias horas (`specs/calendario-viajes.md` §5.4).
# La descarga la hace el servidor, no el dispositivo (§5.1). El feed es un
# secreto —`VIAJES_ICAL_URL`, con `wrangler secret put`— y no va en este fichero.
[triggers]
crons = ["17 5 * * *"]

[observability]
enabled = true
