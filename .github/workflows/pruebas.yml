name: pruebas

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Con la historia entera: el paso del service worker compara con la base
      # de la rama para saber qué ha cambiado.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar las pruebas
        run: python3 -m unittest discover -s tests -v

      # La punta de `main` **ahora**, que es contra lo que hay que comparar y no
      # contra la base del PR.
      #
      # Las dos comprobaciones de abajo miraban `pull_request.base.sha`, o sea la
      # `main` de cuando se abrió el PR. Con dos ramas abiertas a la vez eso no
      # basta: las dos salen de la misma base, las dos suben a la misma versión, y
      # desde su propia base las dos ven un salto correcto. Git funde después las
      # dos líneas idénticas sin conflicto, y el segundo en mergearse publica su
      # trabajo bajo una versión que el primero ya quemó. Pasó con la 1.15.0 y
      # volvió a pasar con la 1.27.0, que es la que se llevó Sitios por delante.
      #
      # El refspec explícito no es adorno: `git fetch origin main` a secas deja la
      # punta en `FETCH_HEAD` y **no toca** `refs/remotes/origin/main`, de modo
      # que lo de abajo estaría comparando contra el ref que dejó `checkout` y no
      # contra lo que este paso acaba de traer. Funcionaría casi siempre —hay
      # segundos entre uno y otro— y sería una casualidad, no una regla.
      - name: Traer la punta de main
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --force origin main:refs/remotes/origin/main

      # Los módulos y los estilos se sirven de la caché del service worker antes
      # que de la red, de modo que un cambio en ellos no llega a quien ya tiene
      # la aplicación abierta hasta que sube `VERSION` en `sw.js`. Olvidarlo no
      # rompe nada visible: simplemente se sigue viendo lo de antes, y desde
      # fuera parece que el cambio no se hizo.
      # Lo mismo por la otra vía. La app de iPhone no lee la web: aplica el
      # bundle OTA, y `ota.yml` solo corta uno nuevo si `pwa/package.json` trae
      # una versión que aún no tiene release. Cambiar `pwa/publico/**` sin subir
      # esa versión hace que el workflow corra, no publique nada y no diga nada:
      # el cambio queda en la web y no llega al teléfono.
      #
      # `ota.yml` ya sabe distinguir ese caso, pero avisa **después del merge**,
      # cuando el trabajo ya está en main y arreglarlo es otro PR. Aquí se mira
      # antes, que es cuando todavía se puede escribir otra cifra.
      - name: Comprobar que el OTA sube de versión si cambia lo que empaqueta
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git diff --name-only origin/main HEAD | grep -q '^pwa/publico/'; then
            echo "No cambia nada de pwa/publico/; el OTA no tiene que moverse."
            exit 0
          fi

          antes=$(git show origin/main:pwa/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          ahora=$(node -p "require('./pwa/package.json').version")

          if [ "$antes" = "$ahora" ]; then
            echo "::error file=pwa/package.json::Cambia pwa/publico/ y la versión del OTA sigue en $ahora, que es la que ya tiene main."
            echo ""
            echo "Suba \"version\" en pwa/package.json por encima de $antes: sin eso,"
            echo "ota.yml ve que esa versión ya tiene release, no corta bundle nuevo,"
            echo "y la app de iPhone se queda con lo anterior sin que nada lo diga."
            exit 1
          fi

          # Y que sube, no que baja. `sort -V` ordena versiones, no cadenas: sin
          # él, «1.9.0» quedaría por encima de «1.10.0».
          if [ "$(printf '%s\n%s\n' "$antes" "$ahora" | sort -V | tail -1)" != "$ahora" ]; then
            echo "::error file=pwa/package.json::La versión del OTA baja: main está en $antes y aquí pone $ahora."
            exit 1
          fi

          # La comprobación definitiva, y la que no depende de que main tenga la
          # cifra escrita: si ya hay release con ese número, ese OTA está
          # publicado y este trabajo no llegaría a ningún teléfono.
          #
          # Se salta si no hay repositorio en el entorno —al correr esto a mano,
          # fuera de Actions— en lugar de reventar por `set -u`. Lo que decide de
          # verdad es la comparación de arriba; esto es el cinturón.
          if [ -n "${GITHUB_REPOSITORY:-}" ] && gh release view "ota-v$ahora" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error file=pwa/package.json::La versión $ahora ya tiene un OTA publicado; elija una por encima."
            exit 1
          fi

          echo "OTA $antes → $ahora, correcto."

      - name: Comprobar que el service worker sube de versión si cambia lo que cachea
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --name-only origin/main HEAD > /tmp/cambiados.txt
          python3 - <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          sw = Path('pwa/publico/sw.js')
          armazon = set(re.findall(r"'([^']+)'", re.search(
              r'const ARMAZON = \[(.*?)\];', sw.read_text(encoding='utf-8'), re.S).group(1)))
          cacheados = {f'pwa/publico{r}' for r in armazon if r != '/'}

          cambiados = set(Path('/tmp/cambiados.txt').read_text().split())
          tocados = sorted(cambiados & cacheados)
          if not tocados:
              sys.exit(0)

          def version(ref):
              try:
                  texto = subprocess.run(
                      ['git', 'show', f'{ref}:pwa/publico/sw.js'],
                      capture_output=True, text=True, check=True).stdout
              except subprocess.CalledProcessError:
                  return None
              hallado = re.search(r"const VERSION = '([^']+)'", texto)
              return hallado.group(1) if hallado else None

          def cifra(valor):
              """`agenda-v37` → 37. Lo que no siga esa forma no se ordena."""
              hallado = re.search(r"(\d+)$", valor or "")
              return int(hallado.group(1)) if hallado else None

          antes, ahora = version('origin/main'), version('HEAD')
          if antes == ahora:
              print(f'::error file=pwa/publico/sw.js::Cambia lo que cachea el service '
                    f'worker y VERSION sigue en {ahora}, que es la que ya tiene main.')
              for ruta in tocados:
                  print(' ·', ruta)
              print('\nSuba VERSION en pwa/publico/sw.js: sin eso, quien ya tenga')
              print('la aplicación abierta seguirá viendo la versión anterior.')
              sys.exit(1)

          nueva, vieja = cifra(ahora), cifra(antes)
          if nueva is not None and vieja is not None and nueva < vieja:
              print(f'::error file=pwa/publico/sw.js::La versión del service worker baja: '
                    f'main está en {antes} y aquí pone {ahora}.')
              sys.exit(1)

          print(f'VERSION {antes} → {ahora}, correcto.')
          PY

      # El mapa es lo que se le inyecta a una sesión al abrirse. Si el commit lo
      # trae desfasado, quien llegue leerá una descripción del código anterior.
      - name: Comprobar que docs/mapa.md corresponde al código
        run: python3 herramientas/mapa.py --verificar

      - name: Comprobar que el registro de ejemplo compone los siete planes
        env:
          AGENDA_PATH: datos/agenda.ejemplo.json
        run: python3 scripts/plan_semanal.py --simulacro --fecha 2026-07-26

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar las pruebas del Worker
        working-directory: api
        run: node --test 'test/*.test.js'

      # Las de la aplicación son pocas y muy concretas: lo que se lee de un
      # calendario ajeno, cuyo formato cambia sin avisar y no lo comprueba nadie
      # más. El resto de la PWA se prueba mirándola.
      - name: Ejecutar las pruebas de la aplicación
        working-directory: pwa
        run: node --test 'test/*.test.js'

      # Lo que sirve la API y lo que lee el generador del plan son el mismo
      # documento: si sus formas divergen, el plan del domingo deja de salir.
      - name: Comprobar que el formato del registro es el mismo en las dos piezas
        env:
          AGENDA_PATH: pwa/publico/demo/registro-demo.json
        run: |
          python3 herramientas/preparar-pwa.py
          python3 scripts/plan_semanal.py --simulacro --fecha 2026-07-26 > /dev/null
