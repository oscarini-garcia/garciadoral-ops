name: pruebas

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar las pruebas
        run: python3 -m unittest discover -s tests -v

      - name: Comprobar que el registro de ejemplo compone los siete planes
        env:
          AGENDA_PATH: datos/agenda.ejemplo.json
        run: python3 scripts/plan_semanal.py --simulacro --fecha 2026-07-26
