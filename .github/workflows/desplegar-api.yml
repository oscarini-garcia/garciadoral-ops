name: desplegar la API

# Sube el Worker a Cloudflare cuando cambia `api/`.
#
# Antes se hacía a mano, con `npm run desplegar` desde una máquina con wrangler
# y sesión iniciada. El problema no era el trabajo —son diez segundos— sino que
# fuera un paso aparte: el código entraba en `main` y el servidor se quedaba
# atrás sin que nada lo dijera, y las rutas nuevas contestaban 404 hasta que
# alguien se acordaba. Publicar es parte de mergear, como ya lo es el bundle OTA.
#
# **Hace falta un secreto**, `CLOUDFLARE_API_TOKEN`, con permiso de edición sobre
# Workers Scripts y sobre D1 (Settings → Secrets and variables → Actions). Y, si
# ese token ve más de una cuenta de Cloudflare, además `CLOUDFLARE_ACCOUNT_ID`.
# Sin el primero el workflow falla en el paso de desplegar y no toca nada.

on:
  # Sin casilla de migraciones: las que falten se aplican solas en cada
  # despliegue, que es lo que el registro hace barato. Lo único que queda a mano
  # es volver a pasar una que ya estaba, para el día que haga falta.
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Volver a aplicar esta migración aunque ya conste (p. ej. 0010_sitios.sql)'
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - 'api/src/**'
      # Y las migraciones, que faltaban. Desde que el registro decide qué se
      # aplica, dejar un `.sql` y mergear tenía que bastar —así está escrito en
      # CLAUDE.md— y no bastaba: un cambio que solo añade una migración no toca
      # `api/src/**` y no disparaba nada, de modo que la tabla se quedaba sin la
      # columna y la pantalla que la usaba salía en blanco sin decir por qué.
      # Le pasó a la `0018`; a la `0017` no, y solo porque su PR tocaba además
      # el repositorio.
      - 'api/migraciones/**'
      - 'api/wrangler.toml'
      - 'api/package.json'
      - '.github/workflows/desplegar-api.yml'

permissions:
  contents: read

# Dos despliegues a la vez dejarían viviendo al que acabe último, que no tiene
# por qué ser el último commit.
concurrency:
  group: api
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Las pruebas, otra vez y aquí. `pruebas.yml` ya las pasó en la rama, pero
      # lo que sale de este job se queda sirviendo a la familia en el acto: no
      # hay revisión por delante ni nadie mirando.
      - name: Pruebas del Worker
        working-directory: api
        run: node --test 'test/*.test.js'

      # Las migraciones que falten, y solo las que falten.
      #
      # Antes iban detrás de una casilla, y aplicarlas era un paso aparte que
      # alguien tenía que acordarse de dar: el empujón a `main` subía el Worker
      # solo, y entre el código nuevo y su tabla había una ventana que duraba lo
      # que tardara esa persona en enterarse. La última vez duró una noche.
      #
      # Ahora corren siempre, porque el registro las hace baratas: se pregunta a
      # la base qué se ha aplicado ya y se pasa únicamente lo que no está. Un
      # despliegue sin migraciones nuevas cuesta una consulta.
      #
      # Y con eso se caen las dos ceremonias que había alrededor. La lista de
      # pendientes de `CLAUDE.md` deja de hacer falta —mentía, y esa mentira
      # costó tres despliegues en rojo—, y las `.unavez` dejan de pedirse por su
      # nombre: el registro sabe cuáles han pasado, que era lo único que aquel
      # campo intentaba recordar.
      #
      # El único fichero que sigue fuera es `0002_catalogos.sql`, y por lo de
      # siempre: va con `INSERT OR REPLACE` y volver a pasarlo pisaría los
      # catálogos que se hayan tocado desde la aplicación. Se siembra como
      # aplicado y no se vuelve a mirar.
      - name: Migraciones que falten
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          set -euo pipefail
          d1() { npx --yes wrangler@4 d1 execute agenda-familiar --remote --yes "$@"; }

          # El registro, primero y siempre: es idempotente, y sin él no hay a
          # quién preguntar. Su propia siembra dice qué había aplicado el día que
          # se escribió.
          echo "→ migraciones/0016_registro.sql (el registro)"
          d1 --file=migraciones/0016_registro.sql > /dev/null

          aplicadas=$(d1 --json --command "SELECT fichero FROM migracion" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const m = s.match(/"fichero"\s*:\s*"([^"]+)"/g) || [];
                console.log(m.map((x) => x.slice(x.indexOf(":") + 1).trim().slice(1, -1)).join("\n"));
              })')

          ya() { printf '%s\n' "$aplicadas" | grep -Fxq "$1"; }

          for ruta in migraciones/*.sql; do
            fichero=$(basename "$ruta")
            if [ "$fichero" != "$FORZAR" ] && ya "$fichero"; then
              echo "· $fichero (ya estaba)"
              continue
            fi
            echo "→ $fichero"
            d1 --file="$ruta"
            d1 --command "INSERT OR IGNORE INTO migracion (fichero) VALUES ('$fichero')" > /dev/null
          done

      - name: Desplegar el Worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # Que el despliegue diga «hecho» no es que la API conteste. Esto sí.
      - name: Comprobar que responde
        run: |
          set -euo pipefail
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            https://agenda-familiar-api.oscarini.workers.dev/api/salud)
          echo "/api/salud → $codigo"
          test "$codigo" = "200"
