<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E62" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1719" media="(prefers-color-scheme: dark)">
<meta name="description" content="La agenda de la familia: la semana, los regalos y la gente.">
<title>Agenda Familiar</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/iconos/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

<!-- Pantalla de acceso. El acceso se realiza exclusivamente mediante Sign in
     with Apple: no hay credenciales propias ni recuperación de contraseña. -->
<section id="acceso" class="acceso" hidden>
  <div class="acceso-marco">
    <p class="eyebrow">Agenda Familiar</p>
    <h1>La semana, los regalos<br>y la gente.</h1>
    <p class="acceso-texto">
      Entra con tu identificador de Apple. Si es la primera vez, alguien del
      hogar tendrá que aprobarte antes de que puedas ver la agenda.
    </p>
    <div id="botonApple" class="apple-boton" role="button" tabindex="0">
      <svg viewBox="0 0 16 16" aria-hidden="true" width="16" height="16"><path fill="currentColor" d="M11.18 8.53c.02-1.6 1.31-2.37 1.37-2.41-.75-1.1-1.91-1.25-2.32-1.26-.99-.1-1.93.58-2.43.58-.5 0-1.27-.57-2.09-.55-1.07.02-2.06.62-2.61 1.58-1.11 1.93-.28 4.79.8 6.36.53.77 1.16 1.63 1.99 1.6.8-.03 1.1-.52 2.06-.52.96 0 1.24.52 2.08.5.86-.01 1.4-.78 1.93-1.55.61-.89.86-1.75.87-1.79-.02-.01-1.67-.64-1.65-2.54zM9.6 3.8c.44-.53.74-1.27.66-2.01-.64.03-1.41.42-1.86.95-.4.47-.76 1.22-.66 1.94.71.06 1.43-.36 1.86-.88z"/></svg>
      <span>Entrar con Apple</span>
    </div>
    <p id="accesoAviso" class="acceso-aviso" hidden></p>
    <button id="botonDemo" class="enlace-discreto" type="button">
      Ver una demostración con datos de ejemplo
    </button>
  </div>
</section>

<!-- Sala de espera: quien ha entrado con Apple y todavía no es del hogar. El
     contenido lo pinta app.js, porque cambia según en qué haya quedado la
     solicitud. -->
<section id="espera" class="acceso" hidden>
  <div id="esperaMarco" class="acceso-marco"></div>
</section>

<!-- Aplicación -->
<div id="aplicacion" class="aplicacion" hidden>
  <header class="cabecera">
    <div class="cabecera-fila">
      <h1 id="tituloPantalla" class="titulo-pantalla">Semana</h1>
      <button id="indicadorSync" class="sync" type="button" title="Estado de la sincronización">
        <i></i><span id="syncTexto">al día</span>
      </button>
      <button id="botonAjustes" class="icono-cabecera" type="button" aria-label="Ajustes" title="Ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-1 1.47V21a2 2 0 1 1-4 0v-.11a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-1H3a2 2 0 1 1 0-4h.11a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.77.32H9a1.6 1.6 0 0 0 1-1.47V3a2 2 0 1 1 4 0v.11a1.6 1.6 0 0 0 1 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77V9a1.6 1.6 0 0 0 1.47 1H21a2 2 0 1 1 0 4h-.11a1.6 1.6 0 0 0-1.47 1z"/>
        </svg>
      </button>
    </div>
    <div id="subcabecera" class="subcabecera"></div>
  </header>

  <main id="pantalla" class="pantalla" tabindex="-1"></main>

  <button id="fab" class="fab" type="button" aria-label="Crear">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>

  <nav class="tabbar" aria-label="Secciones">
    <button data-pestana="semana"  class="tab" aria-current="page"><span class="tab-icono">▤</span>Semana</button>
    <button data-pestana="regalos" class="tab"><span class="tab-icono">◈</span>Regalos</button>
    <button data-pestana="familia" class="tab"><span class="tab-icono">◍</span>Familia</button>
    <button data-pestana="buscar"  class="tab"><span class="tab-icono">⌕</span>Buscar</button>
  </nav>
</div>

<div id="scrim" class="scrim" hidden></div>
<div id="hoja" class="hoja" hidden role="dialog" aria-modal="true"></div>
<div id="avisos" class="avisos" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
