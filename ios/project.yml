# Proyecto de Xcode generado con XcodeGen.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open AgendaFamiliar.xcodeproj
#
# Se genera en lugar de versionarse porque un `.xcodeproj` es un fichero enorme
# y ruidoso en los diffs, y aquí no dice nada que no diga este descriptor.

name: AgendaFamiliar

options:
  bundleIdPrefix: com.EJEMPLO
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AgendaFamiliarCore:
    path: .

targets:
  AgendaFamiliar:
    type: application
    platform: iOS
    sources:
      - path: App/AgendaFamiliar
    dependencies:
      - package: AgendaFamiliarCore
        product: AgendaFamiliarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.EJEMPLO.agenda
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Agenda
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: App/AgendaFamiliar/AgendaFamiliar.entitlements
        SWIFT_VERSION: "5.9"
        # Idioma único: la interfaz se presenta solo en castellano y no se
        # contempla soporte multilingüe (spec funcional §10).
        DEVELOPMENT_LANGUAGE: es
    info:
      path: App/AgendaFamiliar/Info.plist
      properties:
        CFBundleDisplayName: Agenda
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        # La URL del Worker. Se cambia aquí sin tocar código.
        AgendaAPI: https://agenda-familiar-api.EJEMPLO.workers.dev
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  AgendaFamiliarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AgendaFamiliarCoreTests
    dependencies:
      - target: AgendaFamiliar
      - package: AgendaFamiliarCore
        product: AgendaFamiliarCore

schemes:
  AgendaFamiliar:
    build:
      targets:
        AgendaFamiliar: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgendaFamiliarTests
